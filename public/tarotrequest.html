<div id="tarotrequest-ui">
  <input id="tr-name" placeholder="Name" />

  <div class="row">
    <input id="tr-day" placeholder="DD" />
    <input id="tr-month" placeholder="MM" />
    <input id="tr-year" placeholder="YYYY" />
  </div>

  <div class="row">
    <label><input type="radio" name="tr-gender" value="Male"> Male</label>
    <label><input type="radio" name="tr-gender" value="Female"> Female</label>
  </div>

  <select id="tr-category">
    <option value="">Category</option>
    <option value="Love">Love</option>
    <option value="Career">Career</option>
    <option value="Health">Health</option>
  </select>

  <button onclick="sendTarotRequest()">Next</button>
</div>
